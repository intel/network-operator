logLevel: 2

operator:
  image:
    repository: intel/intel-network-operator
    tag: 1.2.1@sha256:ef9a85430f134ac8e4ec5821885ace21a0a0a97ff956ce44afed941089dbe25f
    imagePullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

nfd:
  install: false
  gaudiRule: true

config:
  gaudi:
    enabled: false
    mode: "L3"
    mtu: 8000
    networkManager:
      disable: false
    pfc:
      config: "11110000"
      lldpad: false
    networkMetrics: false
    image:
      repository: intel/intel-network-linkdiscovery
      tag: 1.2.1@sha256:64e984e72373124317ae00c9a3bbf8fdf7ac96968d6d1c35afb94cc436b2928f
      imagePullPolicy: IfNotPresent
    nodeSelector:
      intel.feature.node.kubernetes.io/gaudi-ready: "true"
  hostnic:
    enabled: false
    dranet:
      install: false
      image: registry.k8s.io/networking/dranet:v1.5.0
      imagePullPolicy: IfNotPresent
      rdmaDeviceClass:
        name: dranet-rdma

prometheus:
  labels:
    # replace with the label your Prometheus' selector is configured with:
    #   release: prometheus
    #   release: monitoring
    # or similar
    release: prom
